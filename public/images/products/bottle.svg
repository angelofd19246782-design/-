<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bottleBody" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#5e8e3e"/>
      <stop offset="50%" stop-color="#a3c97e"/>
      <stop offset="100%" stop-color="#3e6b22"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="100" cy="184" rx="36" ry="6" fill="#000" opacity="0.12"/>
  <!-- cap -->
  <rect x="84" y="14" width="32" height="22" rx="3" fill="#3d2c1f" stroke="#1c1006" stroke-width="2"/>
  <line x1="88" y1="20" x2="112" y2="20" stroke="#fff" opacity="0.3" stroke-width="1.5"/>
  <line x1="88" y1="26" x2="112" y2="26" stroke="#fff" opacity="0.3" stroke-width="1.5"/>
  <line x1="88" y1="32" x2="112" y2="32" stroke="#fff" opacity="0.3" stroke-width="1.5"/>
  <!-- neck -->
  <rect x="88" y="36" width="24" height="22" fill="url(#bottleBody)" stroke="#2c4f15" stroke-width="2"/>
  <!-- shoulder + body -->
  <path d="M88 58 Q88 70, 76 78 L72 170 Q72 180, 82 180 L118 180 Q128 180, 128 170 L124 78 Q112 70, 112 58 Z"
        fill="url(#bottleBody)" stroke="#2c4f15" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- label -->
  <rect x="68" y="105" width="64" height="50" rx="2" fill="#fff" stroke="#2c4f15" stroke-width="1.5"/>
  <text x="100" y="125" text-anchor="middle" font-family="serif" font-weight="800" font-size="14" fill="#c9472d">RADUGA</text>
  <line x1="74" y1="132" x2="126" y2="132" stroke="#3a7bbf" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3d2c1f">Premium · 1 L</text>
  <!-- highlight -->
  <path d="M82 80 L78 165" stroke="#fff" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
</svg>
