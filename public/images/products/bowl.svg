<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bowlOutside" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#cdd5db"/>
    </linearGradient>
    <radialGradient id="soupGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e57676"/>
      <stop offset="100%" stop-color="#a13a23"/>
    </radialGradient>
  </defs>
  <!-- steam -->
  <path d="M70 35 Q65 20, 75 10" stroke="#9aa7af" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M100 30 Q95 12, 105 4" stroke="#9aa7af" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M130 35 Q135 18, 125 8" stroke="#9aa7af" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
  <!-- shadow -->
  <ellipse cx="100" cy="178" rx="80" ry="8" fill="#000" opacity="0.12"/>
  <!-- bowl outside -->
  <path d="M22 95 Q22 165, 100 175 Q178 165, 178 95 Z"
        fill="url(#bowlOutside)" stroke="#5a6770" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- rim -->
  <ellipse cx="100" cy="95" rx="78" ry="18" fill="#3a7bbf" stroke="#1f4870" stroke-width="2.5"/>
  <!-- soup -->
  <ellipse cx="100" cy="92" rx="72" ry="15" fill="url(#soupGrad)" stroke="#6f2516" stroke-width="2"/>
  <!-- floating bits -->
  <ellipse cx="80" cy="88" rx="6" ry="3" fill="#cfd6a4" stroke="#5e8e3e" stroke-width="1"/>
  <ellipse cx="115" cy="92" rx="7" ry="3" fill="#f3cf85" stroke="#7a5a35" stroke-width="1"/>
  <circle cx="100" cy="89" r="3" fill="#fff" opacity="0.8"/>
  <ellipse cx="125" cy="86" rx="5" ry="2.5" fill="#cfd6a4" stroke="#5e8e3e" stroke-width="1"/>
  <ellipse cx="70" cy="93" rx="5" ry="2.5" fill="#fff2b8" stroke="#7a5a35" stroke-width="1"/>
  <!-- cream swirl -->
  <path d="M78 95 Q88 90, 95 96 Q105 102, 115 95" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- bowl decoration band -->
  <path d="M30 130 Q100 145, 170 130" stroke="#3a7bbf" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
</svg>
