<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="choco" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a4a1e"/>
      <stop offset="100%" stop-color="#4a2a0e"/>
    </linearGradient>
    <linearGradient id="wrap" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6c95a"/>
      <stop offset="100%" stop-color="#c98944"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="100" cy="180" rx="76" ry="7" fill="#000" opacity="0.1"/>
  <!-- chocolate bar (background, partial) -->
  <g transform="rotate(-10 100 100)">
    <rect x="36" y="60" width="128" height="80" rx="4" fill="url(#choco)" stroke="#2a1808" stroke-width="2.5"/>
    <!-- grid pattern -->
    <line x1="68" y1="60" x2="68" y2="140" stroke="#2a1808" stroke-width="2"/>
    <line x1="100" y1="60" x2="100" y2="140" stroke="#2a1808" stroke-width="2"/>
    <line x1="132" y1="60" x2="132" y2="140" stroke="#2a1808" stroke-width="2"/>
    <line x1="36" y1="100" x2="164" y2="100" stroke="#2a1808" stroke-width="2"/>
    <!-- shine -->
    <rect x="40" y="64" width="24" height="32" rx="2" fill="#fff" opacity="0.18"/>
  </g>
  <!-- wrapper torn diagonally -->
  <g transform="rotate(-10 100 100)">
    <path d="M36 60 L36 140 L70 140 L88 60 Z" fill="url(#wrap)" stroke="#7a4a1e" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="62" y="105" text-anchor="middle" font-family="serif" font-weight="800" font-size="13" fill="#3d2c1f" transform="rotate(-90 62 105)">RADUGA</text>
  </g>
</svg>
