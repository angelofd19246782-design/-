<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="crustGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c98944"/>
      <stop offset="100%" stop-color="#7a4a1e"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="100" cy="170" rx="78" ry="8" fill="#000" opacity="0.1"/>
  <!-- bread base -->
  <path d="M22 110
           Q22 70, 100 60
           Q178 70, 178 110
           Q178 158, 100 162
           Q22 158, 22 110 Z"
        fill="url(#crustGrad)" stroke="#3d2c1f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- top highlight -->
  <path d="M40 90 Q100 70, 160 90" stroke="#f3cf85" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
  <!-- score lines (cuts) -->
  <path d="M50 105 Q60 96, 70 110" stroke="#3d2c1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M82 100 Q92 91, 102 105" stroke="#3d2c1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M114 102 Q124 93, 134 107" stroke="#3d2c1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- flour dust (dots) -->
  <circle cx="55" cy="78" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="78" cy="74" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="105" cy="72" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="135" cy="78" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- coriander seeds (for borodinsky look) -->
  <circle cx="68" cy="125" r="2" fill="#3d2c1f"/>
  <circle cx="98" cy="135" r="2" fill="#3d2c1f"/>
  <circle cx="128" cy="128" r="2" fill="#3d2c1f"/>
  <circle cx="148" cy="120" r="2" fill="#3d2c1f"/>
</svg>
