  <line x1="64" y1="118" x2="136" y2="118" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="74" y1="128" x2="126" y2="128" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
