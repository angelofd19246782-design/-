<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="sausageGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0938e"/>
      <stop offset="100%" stop-color="#a13a23"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="100" cy="180" rx="78" ry="6" fill="#000" opacity="0.1"/>
  <!-- back sausage curve -->
  <path d="M30 60
           Q20 60, 20 75
           Q20 90, 35 95
           L160 95
           Q175 95, 175 80
           Q175 65, 160 65
           L40 65
           Q30 65, 30 60 Z"
        fill="url(#sausageGrad)" stroke="#6f2516" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- tied ends back -->
  <ellipse cx="22" cy="78" rx="6" ry="14" fill="#a13a23" stroke="#6f2516" stroke-width="2"/>
  <ellipse cx="178" cy="80" rx="6" ry="14" fill="#a13a23" stroke="#6f2516" stroke-width="2"/>
  <line x1="14" y1="78" x2="20" y2="80" stroke="#6f2516" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="80" x2="186" y2="78" stroke="#6f2516" stroke-width="2" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M40 72 L156 72" stroke="#fbe9c3" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
  <!-- front sausage -->
  <path d="M28 130
           Q18 130, 18 145
           Q18 160, 33 165
           L160 165
           Q175 165, 175 150
           Q175 135, 160 135
           L38 135
           Q28 135, 28 130 Z"
        fill="url(#sausageGrad)" stroke="#6f2516" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="20" cy="148" rx="6" ry="14" fill="#a13a23" stroke="#6f2516" stroke-width="2"/>
  <ellipse cx="178" cy="150" rx="6" ry="14" fill="#a13a23" stroke="#6f2516" stroke-width="2"/>
  <line x1="12" y1="148" x2="18" y2="150" stroke="#6f2516" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="150" x2="186" y2="148" stroke="#6f2516" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 142 L156 142" stroke="#fbe9c3" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
</svg>
