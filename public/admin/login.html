<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var l = localStorage.getItem('raduga.lang');
        if (l === 'ru' || l === 'en') document.documentElement.lang = l;
      } catch (_) {}
    })();
  </script>
  <title>Staff login — Raduga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500;1,9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="icon" href="/images/raduga-logo.svg" type="image/svg+xml" />
</head>
<body class="admin-body admin-login-body">
  <div class="lang-switch lang-switch-floating" role="group" data-i18n-aria="aria.language" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ru">RU</button>
  </div>

  <main class="admin-login">
    <a href="/" class="brand">
      <span class="brand-mark"><img src="/images/raduga-logo.svg" alt="" /></span>
      <span class="brand-text">
        <span class="brand-name">Raduga</span>
        <span class="brand-sub" data-i18n="brand.subStaff">Staff portal</span>
      </span>
    </a>

    <form class="admin-login-card" id="loginForm" novalidate>
      <h1 data-i18n="admin.signIn">Sign in</h1>
      <p class="muted" data-i18n="admin.signInDesc">Enter your staff credentials to manage incoming orders.</p>

      <label class="field">
        <span data-i18n="admin.username">Username</span>
        <input name="username" type="text" autocomplete="username" required />
      </label>
      <label class="field">
        <span data-i18n="admin.password">Password</span>
        <input name="password" type="password" autocomplete="current-password" required />
      </label>

      <button class="btn btn-primary btn-block" type="submit" id="loginBtn" data-i18n="admin.signIn">Sign in</button>
      <div class="form-error" id="loginError" hidden></div>

      <a class="back-link" href="/" data-i18n="admin.backToStore">← Back to store</a>
    </form>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
